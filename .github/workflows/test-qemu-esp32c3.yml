name: QEMU esp32c3 test 

on:
  workflow_dispatch: # allows manual triggering
  pull_request:
  push:
    branches:
      - main

jobs:
  qemu-esp32c3-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          cd qemu-test && \
          nix-shell --run 'just switch-to-esp32c3 && just build && just run-with-timeout 10 | grep -C999 "loop: 2"'
                
  qemu-esp32c3-macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: DeterminateSystems/nix-installer-action@main
      - run: |
          cd qemu-test && \
          nix-shell --run 'just switch-to-esp32c3 && just build'
                
